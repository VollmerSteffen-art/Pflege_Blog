<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="tk dk">
<title id="tk">Der Pflegeprozess als Kreislauf in sechs Schritten</title>
<desc id="dk">Sechs Kästen im Kreis, im Uhrzeigersinn: 1 Informationen sammeln, 2 Probleme und Ressourcen erkennen, 3 Ziele festlegen, 4 Maßnahmen planen, 5 Pflege durchführen, 6 Evaluation. Von der Evaluation führt ein Pfeil zurück zu Schritt 1.</desc>
