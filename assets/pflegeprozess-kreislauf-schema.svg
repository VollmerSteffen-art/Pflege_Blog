<text x="529.0" y="176.0" font-size="19" fill="#C9D8EA">sammeln</text>
<rect x="766.8" y="223.5" width="290" height="78" rx="14" fill="#0B1F3A"/>
<circle cx="802.8" cy="262.5" r="22" fill="#2DD4C8"/>
<text x="802.8" y="272.5" text-anchor="middle" font-size="28" font-weight="bold" fill="#0B1F3A">2</text>
<text x="840.8" y="258.5" font-size="21" font-weight="bold" fill="#FFFFFF">Probleme und</text>
<text x="840.8" y="283.5" font-size="19" fill="#C9D8EA">Ressourcen erkennen</text>
