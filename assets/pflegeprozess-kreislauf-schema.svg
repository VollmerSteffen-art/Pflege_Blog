<text x="840.8" y="498.5" font-size="19" fill="#C9D8EA">festlegen</text>
<rect x="455.0" y="546.0" width="290" height="78" rx="14" fill="#0B1F3A"/>
<circle cx="491.0" cy="585.0" r="22" fill="#2DD4C8"/>
