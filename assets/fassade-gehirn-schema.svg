<text x="76" y="584" font-size="25" font-weight="800" fill="#FFB454">Entorhinaler Kortex</text>
<text x="76" y="614" font-size="19" fill="#E6EEF7">Nachbar des Hippocampus. Hier beginnt bei</text>
<text x="76" y="640" font-size="19" fill="#E6EEF7">Alzheimer die Tau-Ablagerung.</text>
<path d="M405,233 L776,223" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
<circle cx="405" cy="233" r="5" fill="#FFFFFF"/>
<circle cx="776" cy="223" r="5" fill="#FFFFFF"/>
<text x="790" y="229" font-size="25" font-weight="800" fill="#FFFFFF">Ausweichnetzwerke</text>
<text x="790" y="259" font-size="19" fill="#E6EEF7">Andere Hirnbereiche springen ein</text>
<text x="790" y="285" font-size="19" fill="#E6EEF7">und gleichen Ausfälle aus (Kompensation).</text>
<path d="M434,341 L776,328" stroke="#5FD39A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
<circle cx="434" cy="341" r="5" fill="#5FD39A"/>
<circle cx="776" cy="328" r="5" fill="#5FD39A"/>
<text x="790" y="334" font-size="25" font-weight="800" fill="#5FD39A">Striatum</text>
<text x="790" y="364" font-size="19" fill="#E6EEF7">Nucleus caudatus + Putamen, Teil der</text>
<text x="790" y="390" font-size="19" fill="#E6EEF7">Basalganglien, tief im Gehirn.</text>
<text x="790" y="416" font-size="19" fill="#E6EEF7">Hält eingeübte Abläufe und Gewohnheiten.</text>
<path d="M405,495 L776,463" stroke="#2DD4C8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
<circle cx="405" cy="495" r="5" fill="#2DD4C8"/>
<circle cx="776" cy="463" r="5" fill="#2DD4C8"/>
<text x="790" y="469" font-size="25" font-weight="800" fill="#2DD4C8">Hippocampus</text>
<text x="790" y="499" font-size="19" fill="#E6EEF7">Gedächtnis- und Orientierungszentrum.</text>
<text x="790" y="525" font-size="19" fill="#E6EEF7">Baut die innere Karte neuer Orte.</text>
<text x="790" y="551" font-size="19" fill="#E6EEF7">Bei Alzheimer früh betroffen.</text>
<path d="M623,526 L776,588" stroke="#5FD39A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
<circle cx="623" cy="526" r="5" fill="#5FD39A"/>
<circle cx="776" cy="588" r="5" fill="#5FD39A"/>
<text x="790" y="594" font-size="25" font-weight="800" fill="#5FD39A">Kleinhirn</text>
<text x="790" y="624" font-size="19" fill="#E6EEF7">Koordiniert und stimmt Bewegungen fein ab,</text>
<text x="790" y="650" font-size="19" fill="#E6EEF7">beteiligt am Bewegungslernen.</text>
<rect x="48" y="690" width="540" height="130" rx="26" fill="#fff" fill-opacity="0.08" stroke="#5FD39A" stroke-opacity="0.7" stroke-width="2"/>
<text x="78" y="730" font-size="22" font-weight="800" fill="#5FD39A">Zuhause</text>
<text x="78" y="762" font-size="19" fill="#fff">Eingeübtes läuft von selbst, die Umgebung</text>
<text x="78" y="788" font-size="19" fill="#fff">gibt Hinweise. Die Fassade hält.</text>
<rect x="612" y="690" width="540" height="130" rx="26" fill="#fff" fill-opacity="0.08" stroke="#2DD4C8" stroke-opacity="0.8" stroke-width="2"/>
<text x="642" y="730" font-size="22" font-weight="800" fill="#2DD4C8">Draußen</text>
<text x="642" y="762" font-size="19" fill="#fff">Alles ist neu. Es bräuchte eine neue Karte.</text>
<text x="642" y="788" font-size="19" fill="#fff">Die Fassade kann brechen.</text>
<text x="48" y="846" font-size="15" fill="#A9BCD3">Schematisch, Lage vereinfacht. Eigene Darstellung nach De Wit et al. (2021), Laczó et al. (2022), Chen et al. (2026).</text>
</svg>