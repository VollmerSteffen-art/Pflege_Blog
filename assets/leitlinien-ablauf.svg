<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 650" width="920" height="650" role="img">
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<title>Mein Ablauf mit einer Leitlinie in sieben Schritten</title>
<desc>Sieben Schritte: in Zotero nachsehen, Quelle wählen, Leitlinie prüfen, vollständig ablegen, Stelle anstreichen, selbst lesen, im Text belegen.</desc>
<rect width="920" height="650" rx="14" fill="#0B1F3A"/>
<text x="40" y="56" font-size="28" fill="#FFFFFF" font-weight="bold" text-anchor="start">Mein Ablauf mit einer Leitlinie</text><rect x="40" y="90" width="840" height="62" rx="12" fill="#17406F"/><circle cx="82" cy="121" r="22" fill="#2DD4C8"/><text x="82" y="129" font-size="22" fill="#0B1F3A" font-weight="bold" text-anchor="middle">1</text><text x="124" y="118" font-size="21" fill="#FFFFFF" font-weight="bold" text-anchor="start">Zuerst in Zotero nachsehen</text><text x="124" y="141" font-size="16" fill="#B9C7D8" font-weight="normal" text-anchor="start">Ist die Quelle schon da? Dann nehme ich sie und lege nichts doppelt an.</text><rect x="40" y="164" width="840" height="62" rx="12" fill="#17406F"/><circle cx="82" cy="195" r="22" fill="#2DD4C8"/><text x="82" y="203" font-size="22" fill="#0B1F3A" font-weight="bold" text-anchor="middle">2</text><text x="124" y="192" font-size="21" fill="#FFFFFF" font-weight="bold" text-anchor="start">Passende Quelle wählen</text><text x="124" y="215" font-size="16" fill="#B9C7D8" font-weight="normal" text-anchor="start">Gibt es eine aktuelle S3-Leitlinie, kommt sie zuerst.</text><rect x="40" y="238" width="840" height="62" rx="12" fill="#17406F"/><circle cx="82" cy="269" r="22" fill="#2DD4C8"/><text x="82" y="277" font-size="22" fill="#0B1F3A" font-weight="bold" text-anchor="middle">3</text><text x="124" y="266" font-size="21" fill="#FFFFFF" font-weight="bold" text-anchor="start">Die Leitlinie prüfen</text><text x="124" y="289" font-size="16" fill="#B9C7D8" font-weight="normal" text-anchor="start">Stufe, Gültigkeit, Fachgesellschaft und Zielgruppe.</text><rect x="40" y="312" width="840" height="62" rx="12" fill="#17406F"/><circle cx="82" cy="343" r="22" fill="#2DD4C8"/><text x="82" y="351" font-size="22" fill="#0B1F3A" font-weight="bold" text-anchor="middle">4</text><text x="124" y="340" font-size="21" fill="#FFFFFF" font-weight="bold" text-anchor="start">Vollständig ablegen</text><text x="124" y="363" font-size="16" fill="#B9C7D8" font-weight="normal" text-anchor="start">PDF, Jahr, Registernummer und ein Aufgaben-Tag.</text><rect x="40" y="386" width="840" height="62" rx="12" fill="#17406F"/><circle cx="82" cy="417" r="22" fill="#2DD4C8"/><text x="82" y="425" font-size="22" fill="#0B1F3A" font-weight="bold" text-anchor="middle">5</text><text x="124" y="414" font-size="21" fill="#FFFFFF" font-weight="bold" text-anchor="start">Die Stelle anstreichen</text><text x="124" y="437" font-size="16" fill="#B9C7D8" font-weight="normal" text-anchor="start">Nur die Passage, die ich wirklich nutze.</text><rect x="40" y="460" width="840" height="62" rx="12" fill="#17406F"/><circle cx="82" cy="491" r="22" fill="#2DD4C8"/><text x="82" y="499" font-size="22" fill="#0B1F3A" font-weight="bold" text-anchor="middle">6</text><text x="124" y="488" font-size="21" fill="#FFFFFF" font-weight="bold" text-anchor="start">Selbst lesen</text><text x="124" y="511" font-size="16" fill="#B9C7D8" font-weight="normal" text-anchor="start">Erst wenn ich sie gelesen habe, setze ich den Tag „gelesen“.</text><rect x="40" y="534" width="840" height="62" rx="12" fill="#17406F"/><circle cx="82" cy="565" r="22" fill="#2DD4C8"/><text x="82" y="573" font-size="22" fill="#0B1F3A" font-weight="bold" text-anchor="middle">7</text><text x="124" y="562" font-size="21" fill="#FFFFFF" font-weight="bold" text-anchor="start">Im Text belegen</text><text x="124" y="585" font-size="16" fill="#B9C7D8" font-weight="normal" text-anchor="start">Kurzbeleg mit Seite und das Wort der Leitlinie.</text><text x="40" y="626" font-size="14" fill="#B9C7D8" font-weight="normal" text-anchor="start">eigene Darstellung</text>
</svg>
