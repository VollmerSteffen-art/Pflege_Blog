<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="'Plus Jakarta Sans',system-ui,sans-serif">
<title>FOCUSED: sieben Kommunikationsstrategien im Gespräch mit Menschen mit Demenz</title>
<rect width="1200" height="420" fill="#F4F8FB"/>
<text x="40" y="56" font-size="30" font-weight="800" fill="#0B1F3A">FOCUSED: sieben Strategien im Gespräch</text>
<g transform="translate(40,84)"><rect width="148" height="250" rx="24" fill="#fff" stroke="#D8E2EC" stroke-width="2"/><rect width="148" height="96" rx="24" fill="#0B1F3A"/><rect y="60" width="148" height="36" fill="#0B1F3A"/><text x="74" y="70" text-anchor="middle" font-size="56" font-weight="800" fill="#2DD4C8">F</text><text x="74" y="136" text-anchor="middle" font-size="19" font-weight="800" fill="#0B1F3A">Face to face</text><text x="74" y="178" text-anchor="middle" font-size="17" fill="#0B1F3A">von vorne,</text><text x="74" y="202" text-anchor="middle" font-size="17" fill="#0B1F3A">Blickkontakt</text></g>
<g transform="translate(202,84)"><rect width="148" height="250" rx="24" fill="#fff" stroke="#D8E2EC" stroke-width="2"/><rect width="148" height="96" rx="24" fill="#0B1F3A"/><rect y="60" width="148" height="36" fill="#0B1F3A"/><text x="74" y="70" text-anchor="middle" font-size="56" font-weight="800" fill="#2DD4C8">O</text><text x="74" y="136" text-anchor="middle" font-size="19" font-weight="800" fill="#0B1F3A">Orientation</text><text x="74" y="178" text-anchor="middle" font-size="17" fill="#0B1F3A">Wichtiges</text><text x="74" y="202" text-anchor="middle" font-size="17" fill="#0B1F3A">wiederholen</text></g>
<g transform="translate(364,84)"><rect width="148" height="250" rx="24" fill="#fff" stroke="#D8E2EC" stroke-width="2"/><rect width="148" height="96" rx="24" fill="#0B1F3A"/><rect y="60" width="148" height="36" fill="#0B1F3A"/><text x="74" y="70" text-anchor="middle" font-size="56" font-weight="800" fill="#2DD4C8">C</text><text x="74" y="136" text-anchor="middle" font-size="19" font-weight="800" fill="#0B1F3A">Continuity</text><text x="74" y="178" text-anchor="middle" font-size="17" fill="#0B1F3A">Thema nicht</text><text x="74" y="202" text-anchor="middle" font-size="17" fill="#0B1F3A">abrupt wechseln</text></g>
<g transform="translate(526,84)"><rect width="148" height="250" rx="24" fill="#fff" stroke="#D8E2EC" stroke-width="2"/><rect width="148" height="96" rx="24" fill="#0A7C84"/><rect y="60" width="148" height="36" fill="#0A7C84"/><text x="74" y="70" text-anchor="middle" font-size="56" font-weight="800" fill="#fff">U</text><text x="74" y="136" text-anchor="middle" font-size="19" font-weight="800" fill="#0B1F3A">Unsticking</text><text x="74" y="178" text-anchor="middle" font-size="17" fill="#0B1F3A">bei Wortsuche</text><text x="74" y="202" text-anchor="middle" font-size="17" fill="#0B1F3A">helfen</text></g>
<g transform="translate(688,84)"><rect width="148" height="250" rx="24" fill="#fff" stroke="#D8E2EC" stroke-width="2"/><rect width="148" height="96" rx="24" fill="#0A7C84"/><rect y="60" width="148" height="36" fill="#0A7C84"/><text x="74" y="70" text-anchor="middle" font-size="56" font-weight="800" fill="#fff">S</text><text x="74" y="136" text-anchor="middle" font-size="19" font-weight="800" fill="#0B1F3A">Structure</text><text x="74" y="178" text-anchor="middle" font-size="17" fill="#0B1F3A">einfache Fragen,</text><text x="74" y="202" text-anchor="middle" font-size="17" fill="#0B1F3A">zwei Optionen</text></g>
<g transform="translate(850,84)"><rect width="148" height="250" rx="24" fill="#fff" stroke="#D8E2EC" stroke-width="2"/><rect width="148" height="96" rx="24" fill="#0A7C84"/><rect y="60" width="148" height="36" fill="#0A7C84"/><text x="74" y="70" text-anchor="middle" font-size="56" font-weight="800" fill="#fff">E</text><text x="74" y="136" text-anchor="middle" font-size="19" font-weight="800" fill="#0B1F3A">Exchange</text><text x="74" y="178" text-anchor="middle" font-size="17" fill="#0B1F3A">mit Alltags-</text><text x="74" y="202" text-anchor="middle" font-size="17" fill="#0B1F3A">themen beginnen</text></g>
<g transform="translate(1012,84)"><rect width="148" height="250" rx="24" fill="#fff" stroke="#D8E2EC" stroke-width="2"/><rect width="148" height="96" rx="24" fill="#1E7B4A"/><rect y="60" width="148" height="36" fill="#1E7B4A"/><text x="74" y="70" text-anchor="middle" font-size="56" font-weight="800" fill="#fff">D</text><text x="74" y="136" text-anchor="middle" font-size="19" font-weight="800" fill="#0B1F3A">Direct</text><text x="74" y="178" text-anchor="middle" font-size="17" fill="#0B1F3A">kurze Sätze,</text><text x="74" y="202" text-anchor="middle" font-size="17" fill="#0B1F3A">Gestik, Mimik</text></g>
<text x="40" y="378" font-size="18" fill="#41546B">Eigene Darstellung nach Henrichs et al. (2020, S. 6)</text>
</svg>
