<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="920" height="540" role="img">
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<title>Das prüfe ich auf dem Titelblatt einer Leitlinie</title>
<desc>Ein nachgebautes Titelblatt mit fünf Prüfpunkten: Stufe, Herausgeber, Registernummer, Gültigkeit und Zielgruppe.</desc>
<rect width="920" height="540" rx="14" fill="#0B1F3A"/>
<text x="40" y="56" font-size="28" fill="#FFFFFF" font-weight="bold" text-anchor="start">Das prüfe ich auf dem Titelblatt</text><rect x="40" y="84" width="400" height="400" rx="12" fill="#CDF3F0"/><text x="70" y="130" font-size="14" fill="#187084" font-weight="bold" text-anchor="start">LEITLINIE (BEISPIEL)</text><text x="70" y="170" font-size="26" fill="#0B1F3A" font-weight="bold" text-anchor="start">Titel der Leitlinie</text><text x="70" y="200" font-size="15" fill="#187084" font-weight="normal" text-anchor="start">Version, Datum der Veröffentlichung</text><rect x="62" y="240" width="356" height="36" rx="8" fill="#FFFFFF"/><text x="76" y="264" font-size="14" fill="#187084" font-weight="bold" text-anchor="start">Stufe</text><text x="176" y="264" font-size="14" fill="#0B1F3A" font-weight="normal" text-anchor="start">S3  (Platzhalter)</text><circle cx="436" cy="258" r="0" /><rect x="62" y="286" width="356" height="36" rx="8" fill="#FFFFFF"/><text x="76" y="310" font-size="14" fill="#187084" font-weight="bold" text-anchor="start">Herausgeber</text><text x="176" y="310" font-size="14" fill="#0B1F3A" font-weight="normal" text-anchor="start">Fachgesellschaft  (Platzhalter)</text><circle cx="436" cy="304" r="0" /><rect x="62" y="332" width="356" height="36" rx="8" fill="#FFFFFF"/><text x="76" y="356" font-size="14" fill="#187084" font-weight="bold" text-anchor="start">Register-Nr.</text><text x="176" y="356" font-size="14" fill="#0B1F3A" font-weight="normal" text-anchor="start">AWMF xxx-xxx  (Platzhalter)</text><circle cx="436" cy="350" r="0" /><rect x="62" y="378" width="356" height="36" rx="8" fill="#FFFFFF"/><text x="76" y="402" font-size="14" fill="#187084" font-weight="bold" text-anchor="start">gültig bis</text><text x="176" y="402" font-size="14" fill="#0B1F3A" font-weight="normal" text-anchor="start">TT.MM.JJJJ  (Platzhalter)</text><circle cx="436" cy="396" r="0" /><rect x="62" y="424" width="356" height="36" rx="8" fill="#FFFFFF"/><text x="76" y="448" font-size="14" fill="#187084" font-weight="bold" text-anchor="start">Zielgruppe</text><text x="176" y="448" font-size="14" fill="#0B1F3A" font-weight="normal" text-anchor="start">Pflege / Ärzte  (Platzhalter)</text><circle cx="436" cy="442" r="0" /><circle cx="486" cy="114" r="18" fill="#2DD4C8"/><text x="486" y="121" font-size="18" fill="#0B1F3A" font-weight="bold" text-anchor="middle">1</text><text x="520" y="112" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="start">Stufe: S1, S2k, S2e oder S3?</text><text x="520" y="138" font-size="15" fill="#B9C7D8" font-weight="normal" text-anchor="start">Je höher, desto besser abgesichert.</text><circle cx="486" cy="194" r="18" fill="#2DD4C8"/><text x="486" y="201" font-size="18" fill="#0B1F3A" font-weight="bold" text-anchor="middle">2</text><text x="520" y="192" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="start">Wer hat sie herausgegeben?</text><text x="520" y="218" font-size="15" fill="#B9C7D8" font-weight="normal" text-anchor="start">Nur offizielle Fachgesellschaften, über die AWMF.</text><circle cx="486" cy="274" r="18" fill="#2DD4C8"/><text x="486" y="281" font-size="18" fill="#0B1F3A" font-weight="bold" text-anchor="middle">3</text><text x="520" y="272" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="start">Registernummer notieren</text><text x="520" y="298" font-size="15" fill="#B9C7D8" font-weight="normal" text-anchor="start">Die gehört in jede Quellenangabe.</text><circle cx="486" cy="354" r="18" fill="#2DD4C8"/><text x="486" y="361" font-size="18" fill="#0B1F3A" font-weight="bold" text-anchor="middle">4</text><text x="520" y="352" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="start">Ist sie noch gültig?</text><text x="520" y="378" font-size="15" fill="#B9C7D8" font-weight="normal" text-anchor="start">Steht auf dem Titelblatt. Abgelaufen sage ich dazu.</text><circle cx="486" cy="434" r="18" fill="#2DD4C8"/><text x="486" y="441" font-size="18" fill="#0B1F3A" font-weight="bold" text-anchor="middle">5</text><text x="520" y="432" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="start">Für wen ist sie geschrieben?</text><text x="520" y="458" font-size="15" fill="#B9C7D8" font-weight="normal" text-anchor="start">Für die Pflege oder für Ärztinnen und Ärzte?</text><text x="40" y="520" font-size="14" fill="#B9C7D8" font-weight="normal" text-anchor="start">Titelblatt nachgebaut mit Platzhaltern, keine echte Leitlinie.</text>
</svg>
