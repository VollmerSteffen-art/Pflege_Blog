<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
<title id="t">Zeitleiste zum Fallbeispiel</title>
<desc id="d">Drei Punkte. 2022 Aphasie diagnostiziert und Rückzug von der Schauspielerei. 2023 Diagnose frontotemporale Demenz. 2026 laut seiner Frau erkennt er die Familie, die Diagnose sei ihm nicht bewusst.</desc>
<rect width="1200" height="400" fill="#FFFFFF"/>
<line x1="60" y1="150" x2="1140" y2="150" stroke="#D8E2EC" stroke-width="14" stroke-linecap="round"/>
<text x="200" y="62" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="46" font-weight="700" fill="#0B1F3A">2022</text>
<text x="200" y="96" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#41546B">März</text>
<circle cx="200" cy="150" r="34" fill="#0A7C84" stroke="#FFFFFF" stroke-width="8"/>
<text x="200" y="236" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#41546B">Aphasie diagnostiziert,</text>
<text x="200" y="268" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#41546B">Rückzug von der</text>
<text x="200" y="300" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#41546B">Schauspielerei</text>
<text x="600" y="62" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="46" font-weight="700" fill="#0B1F3A">2023</text>
<text x="600" y="96" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#41546B">Februar</text>
<circle cx="600" cy="150" r="34" fill="#0A7C84" stroke="#FFFFFF" stroke-width="8"/>
<text x="600" y="236" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#41546B">Diagnose frontotemporale</text>
<text x="600" y="268" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#41546B">Demenz bekannt gegeben</text>
<text x="1000" y="62" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="46" font-weight="700" fill="#0B1F3A">2026</text>
<text x="1000" y="96" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#41546B">Stand April</text>
<circle cx="1000" cy="150" r="34" fill="#0A7C84" stroke="#FFFFFF" stroke-width="8"/>
<text x="1000" y="236" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#41546B">Laut seiner Frau erkennt er</text>
<text x="1000" y="268" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#41546B">die Familie, die Diagnose sei</text>
<text x="1000" y="300" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#41546B">ihm nicht bewusst</text>
</svg>