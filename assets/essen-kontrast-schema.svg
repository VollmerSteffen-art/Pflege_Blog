<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="t d">
<title id="t">Kontrast beim Essen</title>
<desc id="d">Links ein weißer Teller mit weißem Reis auf weißer Tischdecke, kaum zu erkennen. Rechts derselbe Reis auf einem roten Teller, deutlich sichtbar.</desc>
<rect width="1200" height="640" fill="#F4F8FB"/>
<rect x="30" y="30" width="555" height="580" rx="22" fill="#FFFFFF" stroke="#D8E2EC" stroke-width="2"/>
<rect x="615" y="30" width="555" height="580" rx="22" fill="#FFFFFF" stroke="#D8E2EC" stroke-width="2"/>
<ellipse cx="307" cy="290" rx="205" ry="190" fill="#F7F7F5" stroke="#E6E6E2" stroke-width="3"/>
<ellipse cx="307" cy="290" rx="150" ry="135" fill="#FBFBFA" stroke="#EEEEEA" stroke-width="2"/>
<path d="M215 300 q92 -110 184 0 q-10 55 -92 58 q-82 -3 -92 -58z" fill="#FFFFFF" stroke="#E9E9E5" stroke-width="2"/>
<ellipse cx="892" cy="290" rx="205" ry="190" fill="#C8352E"/>
<ellipse cx="892" cy="290" rx="150" ry="135" fill="#B22C27"/>
<path d="M800 300 q92 -110 184 0 q-10 55 -92 58 q-82 -3 -92 -58z" fill="#FFFFFF"/>
<text x="307" y="540" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#0B1F3A">Wenig Kontrast</text>
<text x="307" y="580" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#5A6B7B">Wo hört das Essen auf?</text>
<text x="892" y="540" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#0B1F3A">Deutlicher Kontrast</text>
<text x="892" y="580" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#5A6B7B">Das Essen hebt sich ab</text>
</svg>
