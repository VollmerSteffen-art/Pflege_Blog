<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" role="img" aria-labelledby="t d">
<title id="t">Sechs Bausteine der frontotemporalen Demenz als vereinfachte Bilder</title>
<desc id="d">Oben drei Eiweiße, Tau, TDP-43 und FUS, unten drei Gene, C9orf72, MAPT und GRN. Jede Karte zeigt links den normalen Zustand in Türkis und rechts den Zustand bei frontotemporaler Demenz in Orange.</desc>
<rect width="1200" height="880" fill="#F4F8FB"/>
<text x="30" y="46" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0A7C84">Eiweiße, die sich ablagern</text>
