<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="920" height="500" role="img">
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<title>Soll, sollte, kann: Empfehlungsgrade in Leitlinien</title>
<desc>Drei Balken: soll ist eine starke Empfehlung, sollte eine mittlere, kann eine offene.</desc>
<rect width="920" height="500" rx="14" fill="#0B1F3A"/>
<text x="40" y="56" font-size="28" fill="#FFFFFF" font-weight="bold" text-anchor="start">Soll, sollte, kann: das Wort zählt</text><rect x="40" y="100" width="840" height="100" rx="12" fill="#17406F"/><rect x="40" y="100" width="760" height="100" rx="12" fill="#2DD4C8"/><text x="66" y="144" font-size="34" fill="#0B1F3A" font-weight="bold" text-anchor="start">soll</text><text x="66" y="176" font-size="17" fill="#0B1F3A" font-weight="bold" text-anchor="start">starke Empfehlung</text><text x="330" y="160" font-size="15" fill="#0B1F3A" font-weight="normal" text-anchor="start">Das ist der stärkste Ausdruck. Ich schreibe: „laut Leitlinie … soll …“.</text><rect x="40" y="218" width="840" height="100" rx="12" fill="#17406F"/><rect x="40" y="218" width="560" height="100" rx="12" fill="#187084"/><text x="66" y="262" font-size="34" fill="#FFFFFF" font-weight="bold" text-anchor="start">sollte</text><text x="66" y="294" font-size="17" fill="#CDF3F0" font-weight="bold" text-anchor="start">mittlere Empfehlung</text><text x="330" y="278" font-size="15" fill="#FFFFFF" font-weight="normal" text-anchor="start">Weniger stark. Das Wort bleibt „sollte“, ich mache kein „soll“ daraus.</text><rect x="40" y="336" width="840" height="100" rx="12" fill="#17406F"/><rect x="40" y="336" width="360" height="100" rx="12" fill="#187084"/><text x="66" y="380" font-size="34" fill="#FFFFFF" font-weight="bold" text-anchor="start">kann</text><text x="66" y="412" font-size="17" fill="#CDF3F0" font-weight="bold" text-anchor="start">offene Empfehlung</text><text x="416" y="396" font-size="15" fill="#FFFFFF" font-weight="normal" text-anchor="start">Eine Möglichkeit, keine Pflicht. Auch das schreibe ich so.</text><text x="40" y="478" font-size="14" fill="#B9C7D8" font-weight="normal" text-anchor="start">eigene Darstellung, vereinfacht</text>
</svg>
